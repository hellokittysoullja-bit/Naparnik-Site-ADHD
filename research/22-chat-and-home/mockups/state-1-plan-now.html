<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Manrope;src:url(/fonts/manrope-500-cyr.woff2) format(woff2);font-weight:500}
@font-face{font-family:Manrope;src:url(/fonts/manrope-600-cyr.woff2) format(woff2);font-weight:600}
@font-face{font-family:Manrope;src:url(/fonts/manrope-700-cyr.woff2) format(woff2);font-weight:700}
@font-face{font-family:Manrope;src:url(/fonts/manrope-500-lat.woff2) format(woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:Caveat;src:url(/fonts/caveat-500-cyr.woff2) format(woff2);font-weight:500}
@font-face{font-family:Caveat;src:url(/fonts/caveat-500-lat.woff2) format(woff2);font-weight:500;unicode-range:U+0000-00FF}
:root{--primary:oklch(0.86 0.22 130);--lip:oklch(0.66 0.2 131);--fg:oklch(0.96 0.008 110);--muted:oklch(0.78 0.01 110)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#020a08;font-family:Manrope,system-ui;color:var(--fg)}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
/* фон: заставка ночной сцены лендинга (на сайте — тот же зацикленный ролик) */
.sky{position:absolute;inset:0;background:url(/scene/night-portrait.webp) center top/cover no-repeat}
.moon{position:absolute;right:74px;top:128px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#e9e4c7,#c9c3a2 70%);box-shadow:0 0 30px 6px oklch(0.95 0.03 95/.18)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:oklch(0.78 0.03 95/.5)}
.moon::before{width:8px;height:8px;left:9px;top:10px}.moon::after{width:6px;height:6px;left:21px;top:22px}
/* холм под котом: тёплый свет костра прямо в заливке, без масок и размытия */
.knoll{position:absolute;left:-60px;right:-60px;top:398px;height:150px;border-radius:50% 50% 0 0/100% 100% 0 0;
 background:radial-gradient(120px 70px at 34% 18%,oklch(0.55 0.11 60/.55),transparent 75%),radial-gradient(260px 90px at 50% 10%,oklch(0.36 0.06 85/.9),oklch(0.16 0.02 120) 80%)}
.ground{position:absolute;left:0;right:0;top:440px;bottom:0;background:linear-gradient(rgb(3 11 9/0) 0,rgb(3 11 9/.75) 70px,#030b09 150px)}
/* верхняя строка */
.top{position:absolute;left:20px;right:20px;top:58px;display:flex;justify-content:space-between;align-items:center}
.day{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:oklch(0.86 0.02 110/.7)}
.isle{display:flex;align-items:center;gap:6px;padding:7px 11px 7px 9px;border-radius:999px;background:oklch(0.2 0.02 130/.55);border:1px solid oklch(1 0 0/.1);font:600 13px Manrope;color:var(--fg)}
.isle svg{width:15px;height:15px}
/* кот */
.cat{position:absolute;left:50%;top:286px;width:188px;transform:translateX(-46%)}
.cat img{width:100%;display:block;filter:drop-shadow(0 6px 10px rgb(0 0 0/.35))}
.shadow{position:absolute;left:50%;top:410px;width:120px;height:14px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgb(0 0 0/.45),transparent)}
/* костёр: SVG, анимируются только transform и opacity */
.fire{position:absolute;left:52px;top:350px;width:78px;height:86px}
.glow{position:absolute;left:-18px;top:300px;width:220px;height:200px;border-radius:50%;background:radial-gradient(closest-side,oklch(0.75 0.17 60/.33),oklch(0.7 0.15 50/.1) 55%,transparent);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.75;transform:scale(.96)}}
.fl{transform-origin:50% 100%;animation:lick 1.1s ease-in-out infinite}
.fl.b{animation-duration:.9s;animation-delay:-.3s}.fl.c{animation-duration:.7s;animation-delay:-.5s}
@keyframes lick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.07) skewX(-3deg)}65%{transform:scale(1.04,.95) skewX(3deg)}}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:oklch(0.85 0.15 70);box-shadow:0 0 6px oklch(0.8 0.17 60);animation:rise 2.4s linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-70px);opacity:0}}
/* слова кота */
.say{position:absolute;left:24px;right:24px;top:452px;text-align:center;font:500 25px/1.15 Caveat;color:oklch(0.94 0.04 90)}
/* шаг */
.step{position:absolute;left:24px;right:24px;top:478px;text-align:center}
.label{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.26em;color:var(--primary);opacity:.85}
.title{margin-top:10px;font:700 26px/1.12 Manrope;letter-spacing:-.01em}
.task{margin-top:6px;font:500 13.5px Manrope;color:var(--muted)}
.links{margin-top:10px;font:600 13px Manrope;color:oklch(0.8 0.01 110/.75)}
.links span{padding:0 8px}
/* главная кнопка — как «Давай» на лендинге: объёмная, с губой */
.cta{position:absolute;left:16px;right:16px;top:604px;height:58px;border-radius:16px;background:var(--primary);box-shadow:0 4px 0 var(--lip),0 14px 30px -12px oklch(0.86 0.22 130/.5);display:flex;align-items:center;justify-content:center;gap:10px;color:#13200a;font:700 18px Manrope;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0 auto 0 0;width:38%;background:linear-gradient(105deg,transparent,oklch(1 0 0/.22),transparent);transform:translateX(120%) skewX(-18deg)}
.cta small{font:600 14px Manrope;opacity:.65}
/* таб-бар */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:oklch(0.16 0.01 130/.92);border-top:1px solid oklch(1 0 0/.07);display:flex;justify-content:space-around;padding-top:9px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;font:600 12px Manrope;color:oklch(0.75 0.01 110)}
.nav .on{color:var(--primary)}
.nav .on i{background:oklch(0.86 0.22 130/.14)}
.nav i{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* === кнопки чата: три варианта === */
.chat{position:absolute;left:16px;right:16px;top:690px;height:52px}
/* A: реплика с ушками — капсула-пузырь, ушки кота выглядывают из-за верхнего края */
.vA .chat{border-radius:23px;background:oklch(0.23 0.015 130/.92);border:1px solid oklch(1 0 0/.12);box-shadow:0 3px 0 oklch(0.13 0.01 130),inset 0 1px 0 oklch(1 0 0/.06);display:flex;align-items:center;padding:0 6px 0 16px;gap:10px}
.vA .ears{position:absolute;left:22px;top:-15px;width:52px;height:18px}
.vA .ear{position:absolute;bottom:0;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid oklch(0.23 0.015 130)}
.vA .ear::after{content:"";position:absolute;left:-4px;top:5px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid oklch(0.62 0.12 30/.7)}
.vA .ear.l{left:0;transform:rotate(-12deg)}.vA .ear.r{left:20px;transform:rotate(12deg)}
.ph{flex:1;font:500 21px/1 Caveat;color:oklch(0.86 0.02 100/.85)}
.dot{width:8px;height:8px;border-radius:50%;background:oklch(0.78 0.16 60);box-shadow:0 0 10px oklch(0.78 0.17 60)}
.mic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:oklch(0.3 0.015 130)}
.mic svg{width:17px;height:17px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round}
/* B: записка у костра — тёплый листок, чуть наклонён, с отпечатком лапы */
.vB .chat{border-radius:6px 14px 14px 14px;background:linear-gradient(#f3ead2,#e8dcbc);transform:rotate(-1.2deg);box-shadow:0 3px 0 #b9a77c,0 10px 22px -8px rgb(0 0 0/.6);display:flex;align-items:center;padding:0 14px;gap:10px;color:#3b2f1c}
.vB .chat::before{content:"";position:absolute;left:18px;top:-7px;width:38px;height:13px;background:oklch(0.86 0.22 130/.55);transform:rotate(-4deg);border-radius:2px}
.vB .ph{color:#5a4627;font-size:23px}
.paw{width:22px;height:22px;opacity:.55}
/* C: уголёк — объёмная тёмная кнопка с тёплой губой и аватаром кота */
.vC .chat{border-radius:16px;background:oklch(0.25 0.02 60);box-shadow:0 4px 0 oklch(0.55 0.14 55),0 12px 26px -10px oklch(0.7 0.16 55/.45);display:flex;align-items:center;padding:0 14px 0 8px;gap:11px}
.ava{width:34px;height:34px;border-radius:50%;background:url(/mascot/poster/neutral.webp) 25% 8%/290% no-repeat,oklch(0.3 0.02 60);box-shadow:0 0 0 2px oklch(0.7 0.16 55/.8),0 0 14px oklch(0.75 0.17 55/.5)}
.vC .txt{flex:1;font:700 16px Manrope}
.vC .txt b{display:block;font:500 12px Manrope;color:oklch(0.85 0.05 70/.75);margin-top:1px}
.chev{width:18px;height:18px;fill:none;stroke:oklch(0.85 0.05 70);stroke-width:2.2;stroke-linecap:round}
.embers i{position:absolute;width:3px;height:3px;border-radius:50%;background:oklch(0.82 0.16 65);box-shadow:0 0 6px oklch(0.8 0.17 60)}

/* D: записка-кнопка — цвет листка, губа как у «Начать», но тоньше (3 px против 4) и ниже (48 против 58) */
.vD .chat{border-radius:14px;background:linear-gradient(#f4ecd6,#e9ddbf);box-shadow:0 3px 0 #b5a175,0 10px 22px -10px rgb(0 0 0/.6);display:flex;align-items:center;gap:12px;padding:0 16px;color:#3b2f1c;transition:transform 110ms,box-shadow 110ms}
.vD .chat::before{content:"";position:absolute;left:20px;top:-8px;width:40px;height:14px;background:oklch(0.86 0.22 130/.6);transform:rotate(-4deg);border-radius:2px}
.vD.pressed .chat{transform:translateY(3px);box-shadow:0 0 0 #b5a175,0 6px 14px -10px rgb(0 0 0/.6)}
.vD .txt{flex:1;text-align:center;font:700 18px Manrope;color:#3b2f1c}
.vD .txt b{display:block;font:500 12px Manrope;color:#7a6440;margin-top:1px}
.vD .paw{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:24px;height:24px;opacity:.7}
</style></head><body><div class="screen vD">
<div class="sky"></div><div class="moon"></div>
<div class="glow"></div>
<div class="knoll"></div><div class="ground"></div>
<div class="top"><div class="day"></div>
 <div class="isle"><svg viewBox="0 0 24 24" fill="none" stroke="oklch(0.86 0.22 130)" stroke-width="2" stroke-linecap="round"><path d="M7 20h10M12 20c0-5 0-8 4-11M12 13c-2-3-5-3-6-3 0 3 2 5 6 5"/></svg>5 находок</div></div>
<div class="shadow"></div>
<div class="cat"><img src="/mascot/poster/neutral.webp" alt=""></div>
<div class="fire">
 <svg viewBox="0 0 78 86" width="78" height="86">
  <defs>
   <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a1a"/><stop offset=".6" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffd166" stop-opacity=".2"/></linearGradient>
   <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb43a"/><stop offset="1" stop-color="#ffe9a3" stop-opacity=".5"/></linearGradient>
   <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#ffe08a" stop-opacity=".3"/></linearGradient>
  </defs>
  <g class="fl"><path d="M39 76C20 76 15 60 22 47c4-8 3-16 1-22 9 5 12 13 12 19 3-9 9-17 8-30 12 10 18 26 15 40 4-3 5-9 5-13 6 10 6 35-24 35z" fill="url(#g1)"/></g>
  <g class="fl b"><path d="M39 76c-12 0-15-10-11-18 3-6 3-11 2-15 6 4 8 9 8 13 2-6 6-11 6-19 7 7 11 17 9 26 2-2 3-5 3-8 4 7 3 21-17 21z" fill="url(#g2)"/></g>
  <g class="fl c"><path d="M39 76c-6 0-8-6-6-10 2-4 2-7 2-9 3 3 4 6 4 8 1-3 3-6 3-10 4 4 6 9 5 14 1-1 1-2 1-4 2 5 1 11-9 11z" fill="url(#g3)"/></g>
  <rect x="12" y="73" width="54" height="8" rx="4" fill="#5b3a22" transform="rotate(-10 39 77)"/>
  <rect x="12" y="73" width="54" height="8" rx="4" fill="#6e4628" transform="rotate(12 39 77)"/>
  <rect x="16" y="75" width="46" height="2" rx="1" fill="#ff8a3d" opacity=".55" transform="rotate(12 39 77)"/>
 </svg>
 <span class="spark" style="left:30px;top:20px;--dx:-8px;animation-delay:.2s"></span>
 <span class="spark" style="left:44px;top:14px;--dx:10px;animation-delay:1.1s"></span>
 <span class="spark" style="left:37px;top:26px;--dx:2px;animation-delay:1.8s"></span>
</div>

<div class="step"><div class="label">ПО ПЛАНУ · 9:00</div><div class="title">Открыть файл с курсовой</div><div class="task">курсовая по логистике</div></div>
<div class="cta">Начать</div>
<div class="chat"><svg class="paw" viewBox="0 0 24 24" fill="#6b4e2a"><ellipse cx="12" cy="15.5" rx="5" ry="4.2"/><circle cx="6" cy="9.5" r="2"/><circle cx="10" cy="6.5" r="2"/><circle cx="14" cy="6.5" r="2"/><circle cx="18" cy="9.5" r="2"/></svg><span class="txt">Поговорить с котом</span></div>
<div class="nav">
 <div class="on"><i><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></i>Дом</div>
 <div><i><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg></i>Фокус</div>
 <div><i><svg viewBox="0 0 24 24"><path d="M7 20h10M12 20c0-6 0-9 5-12M12 13c-3-4-6-4-8-4 0 4 3 6 8 6"/></svg></i>Мир</div>
</div>
</div></body></html>
