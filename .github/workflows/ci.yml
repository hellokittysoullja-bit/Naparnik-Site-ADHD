# Проверка каждого PR и пуша в main: типы, линтер, модульные тесты, прод-сборка и сквозные сценарии в браузере.
# Красный CI = в прод не едет. Ключа ИИ здесь нет намеренно: e2e проверяют и скриптовый фолбэк напарника.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Токен CI только читает репозиторий: шагам сборки и тестов писать в него незачем.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Действия закреплены по коммиту (тег можно перевесить на чужой код); обновляет Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # --with-deps доставляет через apt девять пакетов запасных шрифтов (CJK, тайский, X11); всё остальное в образе
      # раннера уже есть. 11.11 зеркало apt не отвечало, шаг падал через 10 минут таймаутов, и e2e на main не запускались
      # вовсе (два прогона подряд). Короткий таймаут apt и запасной путь без этих пакетов: сайт рисует своими шрифтами.
      - name: Install Chromium
        run: |
          echo 'Acquire::Retries "1"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
          pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e-report
            test-results
          retention-days: 7
