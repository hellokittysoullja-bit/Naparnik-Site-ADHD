# Проверка каждого PR и пуша в main: типы, линтер, модульные тесты, прод-сборка и сквозные сценарии в браузере.
# Красный CI = в прод не едет. Ключа ИИ здесь нет намеренно: e2e проверяют и скриптовый фолбэк напарника.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Токен CI только читает репозиторий: шагам сборки и тестов писать в него незачем.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Действия закреплены по коммиту (тег можно перевесить на чужой код); обновляет Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e-report
            test-results
          retention-days: 7
