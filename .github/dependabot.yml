# Обновления зависимостей раз в неделю, одной пачкой на экосистему (меньше PR — меньше шума).
# Свежие версии npm ставятся не раньше чем через сутки после публикации (.npmrc, minimum-release-age).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
